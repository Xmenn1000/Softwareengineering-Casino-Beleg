services:

  roulette-db:
    container_name: Roulette-PostgresDB
    profiles: [full, db]
    image: postgres:17
    environment:
      - POSTGRES_DB=roulette
      - POSTGRES_USER=postgresUser
      - POSTGRES_PASSWORD=postgresPW
    ports:
      - "15433:5432"
    restart: unless-stopped
    volumes:
      - roulette-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgresUser -d roulette" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  roulette-backend:
    profiles: [full]
    container_name: Roulette-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://roulette-db:5432/roulette
    build: .
    ports:
      - "8081:8081"
    depends_on:
      roulette-db:
        condition: service_healthy

volumes:
  roulette-db-data:

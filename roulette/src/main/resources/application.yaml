server:
  port: 8081
spring:
  application:
    name: Roulette
  datasource:
    url: jdbc:postgresql://localhost:15433/roulette
    username: postgresUser
    password: postgresPW
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update

casino:
  services:
    bank:
      baseURL: ${CASINO_BANK_BASE_URL:http://localhost:8080/casino/bank/api}

  roulette:
    betting:
      minAmount: "1.00"
      maxAmount: "1000.00"
    banking:
      invoicingParty: ROULETTE
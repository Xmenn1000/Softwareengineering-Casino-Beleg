services:

  banking-db:
    container_name: Banking-PostgresDB
    profiles: [full, db]
    image: postgres
    environment:
      - POSTGRES_DB=banking
      - POSTGRES_USER=postgresUser
      - POSTGRES_PASSWORD=postgresPW
    ports:
      - "55432:5432"
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/backup/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgresUser -d banking" ]
      interval: 30s
      timeout: 10s
      retries: 5

  banking-backend:
    profiles: [full]
    container_name: Banking-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://banking-db:5432/banking
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - banking-db

volumes:
  db-data:
